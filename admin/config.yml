backend:
  name: github
  repo: microgap-lab/microgap-lab-site
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Site
    files:
      - name: gallery
        label: Gallery
        file: content/gallery.json
        format: json
        fields:
          - label: Projects
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Date
                name: date
                widget: string
                hint: "Format: 2026-10-04"
              - label: Category
                name: category
                widget: select
                options:
                  - Auto and Mechanical
                  - Decor
                  - Custom project
                  - Toys and Gaming
                  - Art and Sculptures
                  - CAD design
              - label: Material
                name: material
                widget: string
                required: false
              - label: Layer height, for example 0.16 mm
                name: layer
                widget: string
                required: false
              - label: Print time, for example 4 h
                name: time
                widget: string
                required: false
              - label: Description
                name: description
                widget: text
                required: false
              - label: Photos
                name: images
                widget: list
                required: false
                field:
                  label: Photo
                  name: photo
                  widget: image
      - name: settings
        label: Logo and contact links
        file: content/settings.json
        format: json
        fields:
          - label: Logo (square image works best)
            name: logo
            widget: image
            required: false
          - label: WhatsApp number, digits only like 213555123456
            name: whatsapp
            widget: string
            required: false
          - label: Facebook URL
            name: facebook
            widget: string
            required: false
          - label: Instagram URL
            name: instagram
            widget: string
            required: false
          - label: TikTok URL
            name: tiktok
            widget: string
            required: false
          - label: Public email
            name: email
            widget: string
            required: false
          - label: Web3Forms access key (so you never edit index.html)
            name: form_key
            widget: string
            required: false
      - name: reviews
        label: Client reviews
        file: content/reviews.json
        format: json
        fields:
          - label: Reviews
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.name}}"
            fields:
              - label: Client name (first name or initials)
                name: name
                widget: string
              - label: Wilaya
                name: city
                widget: string
                required: false
              - label: Rating (1 to 5)
                name: rating
                widget: number
                value_type: int
                min: 1
                max: 5
                default: 5
              - label: Comment
                name: text
                widget: text
              - label: Photo (print installed, or screenshot of their message)
                name: photo
                widget: image
                required: false
