backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/microgap-lab   # change to your repo
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
collections:
  - name: site
    label: Site
    files:
      - name: gallery
        label: Gallery (add new work here)
        file: content/gallery.json
        format: json
        fields:
          - label: Projects
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - label: Category
                name: category
                widget: select
                options: ["Auto & Mechanical", "Decor", "Custom project", "CAD design"]
              - {label: Material, name: material, widget: string, required: false}
              - {label: Description, name: description, widget: text, required: false}
              - label: Photos (first one is the cover)
                name: images
                widget: list
                required: false
                field: {label: Photo, name: photo, widget: image}
      - name: settings
        label: Contact links and WhatsApp
        file: content/settings.json
        format: json
        fields:
          - {label: "WhatsApp number (e.g. 213555123456, leave empty to hide)", name: whatsapp, widget: string, required: false}
          - {label: Facebook page URL, name: facebook, widget: string, required: false}
          - {label: Instagram URL, name: instagram, widget: string, required: false}
          - {label: TikTok URL, name: tiktok, widget: string, required: false}
          - {label: Linktree URL, name: linktree, widget: string, required: false}
          - {label: Public email, name: email, widget: string, required: false}
