backend:
  name: github
  repo: microgap-lab/microgap-lab-site
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Site
    files:
      - name: gallery
        label: Gallery
        file: content/gallery.json
        format: json
        fields:
          - label: Projects
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Date
                name: date
                widget: string
                hint: "Format: 2026-10-04"
              - label: Category
                name: category
                widget: select
                options:
                  - Auto and Mechanical
                  - Decor
                  - Custom project
                  - CAD design
              - label: Material
                name: material
                widget: string
                required: false
              - label: Description
                name: description
                widget: text
                required: false
              - label: Photos
                name: images
                widget: list
                required: false
                field:
                  label: Photo
                  name: photo
                  widget: image
      - name: settings
        label: Contact links
        file: content/settings.json
        format: json
        fields:
          - label: WhatsApp number, digits only like 213555123456
            name: whatsapp
            widget: string
            required: false
          - label: Facebook URL
            name: facebook
            widget: string
            required: false
          - label: Instagram URL
            name: instagram
            widget: string
            required: false
          - label: TikTok URL
            name: tiktok
            widget: string
            required: false
          - label: Linktree URL
            name: linktree
            widget: string
            required: false
          - label: Public email
            name: email
            widget: string
            required: false
